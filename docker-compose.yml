services:
  postgres:
    image: postgres:16
    container_name: syncora-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ojglobal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-syncora_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ojglobal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: syncora-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextjs:
    build: .
    command: pnpm run dev
    container_name: syncora-app
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      PARTNER_API_URL: ${PARTNER_API_URL}
      PARTNER_API_KEY: ${PARTNER_API_KEY}
      INFLOW_API_KEY: ${INFLOW_API_KEY}
      INFLOW_API_URL: ${INFLOW_API_URL}
      INFLOW_COMPANY_ID: ${INFLOW_COMPANY_ID}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    develop:
      watch:
        - path: ./app
          target: /app/app
          action: sync
        - path: ./app/api
          target: /app/app/api
          action: sync
        - path: ./app/components
          target: /app/app/components
          action: sync

  worker:
    build: .
    command: pnpm run worker
    container_name: syncora-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ojglobal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-syncora_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INFLOW_API_KEY: ${INFLOW_API_KEY}
      INFLOW_API_URL: ${INFLOW_API_URL}
      INFLOW_COMPANY_ID: ${INFLOW_COMPANY_ID}
      PARTNER_API_URL: ${PARTNER_API_URL}
      PARTNER_API_KEY: ${PARTNER_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    develop:
      watch:
        - path: ./worker.ts
          target: /app/worker.ts
          action: sync
